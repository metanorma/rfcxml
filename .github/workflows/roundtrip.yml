# GitHub Actions workflow for RFC XML round-trip testing
# Tests all RFC XML v3 files from rfc-editor.org
#
# Issue: https://github.com/metanorma/rfcxml/issues/4

name: RFC Round-Trip Tests

on:
  # Manual trigger
  workflow_dispatch:
  # Weekly run to catch new RFCs (Sundays at 00:00 UTC)
  schedule:
    - cron: '0 0 * * 0'
  # Also run on pushes to main for early detection of issues
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'spec/**'
      - 'scripts/roundtrip_test.rb'
  pull_request:
    paths:
      - 'lib/**'
      - 'spec/**'
      - 'scripts/roundtrip_test.rb'

permissions:
  contents: read

jobs:
  roundtrip:
    name: Test RFC XML Round-Trips
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Download RFC XML files
        run: |
          mkdir -p rfc-xml-source
          echo "Syncing published RFC XML files via rsync..."
          # rfc-editor.org retired the bulk tarball; rsync is now the official source.
          # --include='*.xml' --exclude='*' (without --include='*/') limits the transfer
          # to XML files at the module root, which are the published RFCs.
          rsync -az --include='*.xml' --exclude='*' \
            rsync.rfc-editor.org::rfcs/ rfc-xml-source/
          echo "XML_DIR=rfc-xml-source" >> $GITHUB_ENV
          FILE_COUNT=$(find "$XML_DIR" -maxdepth 1 -name "*.xml" -type f | wc -l)
          echo "Found $FILE_COUNT published RFC XML files in $XML_DIR"

      - name: Run round-trip tests
        run: |
          echo "Testing all RFC XML files..."
          ruby scripts/roundtrip_test.rb "$XML_DIR"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: roundtrip-results
          path: tmp/roundtrip-results-*/
          retention-days: 30
          if-no-files-found: warn
